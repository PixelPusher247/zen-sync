<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c26"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <linearGradient id="arrows" gradientUnits="userSpaceOnUse" x1="39" y1="47" x2="89" y2="81">
      <stop offset="0%" stop-color="#9180f9"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="64" cy="64" r="37" fill="none" stroke="#7c6af7" stroke-width="1" opacity="0.15"/>

  <!-- Arc 1: 325° → 145° clockwise (right/bottom half) -->
  <path d="M 88.6 46.8 A 30 30 0 0 1 39.4 81.2"
        fill="none" stroke="url(#arrows)" stroke-width="8.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Arrowhead at 145° end, pointing (0.574, 0.819) lower-right -->
  <polygon points="39.4,81.2 29.0,75.1 37.2,69.3" fill="url(#arrows)" filter="url(#glow)"/>

  <!-- Arc 2: 145° → 325° clockwise (left/top half) -->
  <path d="M 39.4 81.2 A 30 30 0 0 1 88.6 46.8"
        fill="none" stroke="url(#arrows)" stroke-width="8.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Arrowhead at 325° end, pointing (-0.574, -0.819) upper-left -->
  <polygon points="88.6,46.8 99.0,52.9 90.8,58.7" fill="url(#arrows)" filter="url(#glow)"/>
</svg>
